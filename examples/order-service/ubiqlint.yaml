vocabularies:
  role: [repository, factory, policy]

rules:
  - id: domain-type
    include: ["src/main/java/**/domain/**"]
    target: type
    patterns:
      - "{noun}"
      - "{noun}{role}"
      - "{noun}{verb:pp}"

  - id: domain-method
    include: ["src/main/java/**/domain/**"]
    target: method
    patterns:
      - "{verb}"
      - "{verb}{noun}"

  - id: dto-type
    include: ["src/main/java/**/dto/**"]
    target: type
    patterns:
      - "{noun}Dto"

  - id: dto-method
    include: ["src/main/java/**/dto/**"]
    target: method
    patterns:
      - "get{any}"
      - "set{any}"

import_rules:
  - id: order-imports
    include: ["src/main/java/com/example/order/domain/**"]
    internal_namespaces: [com.example.order]

  - id: billing-imports
    include: ["src/main/java/com/example/billing/domain/**"]
    internal_namespaces: [com.example.billing]
