[package]
name = "tree-sitter-java"
description = "tree-sitter-java 0.23.5, patched for ubiqlint to accept modifiers in patterns"
version = "0.23.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/tree-sitter/tree-sitter-java"
build = "bindings/rust/build.rs"
publish = false

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"
